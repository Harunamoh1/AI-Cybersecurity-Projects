# SentinelAI: `docker compose up --build`, then open http://localhost:3000
#
# Optional: set SENTINEL_API_KEY (e.g. in a .env file next to this file) to require
# a shared secret on every backend API call. The frontend server injects it; the
# browser never sees it.
services:
  backend:
    build: ./backend
    environment:
      SENTINEL_CORS_ORIGINS: http://localhost:3000
      SENTINEL_API_KEY: ${SENTINEL_API_KEY:-}
      SENTINEL_RATE_LIMIT: "60"
    volumes:
      - detection-history:/data
    # Not published to the host: the frontend proxies /api/* to it on the
    # internal network. Uncomment to call the API directly (Swagger UI at /docs).
    # ports:
    #   - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    pids_limit: 256
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      SENTINEL_API_KEY: ${SENTINEL_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    restart: unless-stopped

volumes:
  detection-history:
