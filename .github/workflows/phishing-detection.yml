name: phishing-detection

on:
  push:
    paths: ["phishing-detection/**", ".github/workflows/phishing-detection.yml"]
  pull_request:
    paths: ["phishing-detection/**", ".github/workflows/phishing-detection.yml"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phishing-detection/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: phishing-detection/backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Verify committed model checksum
        run: cd models && sha256sum -c phishlens_model.sha256
      - name: Tests
        run: pytest --cov --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phishing-detection/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: phishing-detection/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: phishing-detection
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
